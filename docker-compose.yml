version: '3.4'

services:
  ai-kakeibo-backend:
    image: ${DOCKER_REGISTRY-}ai-kakeibo-backend
    build:
      context: .
      dockerfile: src/AiKakeiboBackend/Dockerfile
    depends_on:
      - db
    networks:
      - ai-kakeibo-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ai-kakeibo-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ai-kakeibo-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  sqlserver-data:

networks:
  ai-kakeibo-network:
    driver: bridge
